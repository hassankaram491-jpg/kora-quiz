<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg: #1a0f08;
    --card: #2b190d;
    --line: #4a2c15;
    --text: #f5ede3;
    --muted: #b8977a;
    --accent: #ff7a1a;
    --green: #2ecc71;
    --red: #e74c3c;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: radial-gradient(circle at top, #3a2010, var(--bg));
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .wrap{ width: 100%; max-width: 520px; }

  header{
    text-align:center;
    margin-bottom: 1.5rem;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 0.08em;
  }

  h1{
    font-size: 1.8rem;
    font-weight: 800;
    margin-top: 0.4rem;
  }

  .stats{
    display:flex;
    justify-content: space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1rem;
    padding: 0 0.2rem;
  }

  .stats b{ color: var(--text); }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.8rem;
  }

  .question{
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 1.4rem;
    line-height: 1.6;
  }

  .options{
    display: grid;
    gap: 0.7rem;
  }

  .opt{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    padding: 0.9rem 1rem;
    border-radius: 10px;
    cursor: pointer;
    text-align: right;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .opt:hover{ border-color: var(--accent); }
  .opt.correct{ background: rgba(46,204,113,0.15); border-color: var(--green); }
  .opt.wrong{ background: rgba(231,76,60,0.15); border-color: var(--red); }
  .opt[disabled]{ cursor: default; }

  .timer-wrap{
    width: 100%;
    height: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 1.2rem;
  }

  .timer-bar{
    height: 100%;
    width: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 1s linear, background-color 0.3s ease;
  }

  .timer-bar.warn{ background: var(--red); }

  .timer-num{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent);
  }

  .next{
    margin-top: 1.4rem;
    width: 100%;
    padding: 0.9rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #1a1300;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    display: none;
  }

  .final{
    text-align: center;
  }

  .final .score{
    font-size: 3rem;
    font-weight: 800;
    color: var(--accent);
    margin: 1rem 0;
  }

  .final p{ color: var(--muted); margin-bottom: 1.4rem; }

  .restart{
    padding: 0.8rem 1.6rem;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>

function pickRandomQuestions(pool, count){
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

const QUESTIONS_PER_ROUND = 30;
const questions = pickRandomQuestions(allQuestions, QUESTIONS_PER_ROUND);

let current = 0;
let score = 0;

const TIME_PER_QUESTION = 15; // بالثواني
let timeLeft = TIME_PER_QUESTION;
let timerInterval = null;

const card = document.getElementById('card');
const qnumEl = document.getElementById('qnum');
const qtotalEl = document.getElementById('qtotal');
const scoreEl = document.getElementById('score');
const timeLeftEl = document.getElementById('timeLeft');

qtotalEl.textContent = questions.length;

function renderQuestion(){
  const item = questions[current];
  qnumEl.textContent = current + 1;
  scoreEl.textContent = score;

  card.innerHTML = `
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="question">${item.q}</div>
    <div class="options" id="options"></div>
    <button class="next" id="nextBtn">${current === questions.length - 1 ? 'شوف النتيجة' : 'السؤال التالي'}</button>
  `;

  const optionsEl = document.getElementById('options');
  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(i));
    optionsEl.appendChild(btn);
  });

  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = TIME_PER_QUESTION;
  updateTimerUI();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      selectAnswer(-1); // انتهى الوقت من غير إجابة
    }
  }, 1000);
}

function updateTimerUI(){
  if(timeLeftEl) timeLeftEl.textContent = timeLeft;
  const bar = document.getElementById('timerBar');
  if(bar){
    bar.style.width = (timeLeft / TIME_PER_QUESTION * 100) + '%';
    bar.classList.toggle('warn', timeLeft <= 5);
  }
}

function selectAnswer(i){
  clearInterval(timerInterval);
  const item = questions[current];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.disabled = true);

  if(i === item.correct){
    opts[i].classList.add('correct');
    score++;
    scoreEl.textContent = score;
  } else {
    if(i >= 0) opts[i].classList.add('wrong');
    opts[item.correct].classList.add('correct');
  }

  document.getElementById('nextBtn').style.display = 'block';
}

document.addEventListener('click', (e) => {
  if(e.target.id === 'nextBtn'){
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      showFinal();
    }
  }
  if(e.target.id === 'restartBtn'){
    current = 0;
    score = 0;
    questions.length = 0;
    questions.push(...pickRandomQuestions(allQuestions, QUESTIONS_PER_ROUND));
    renderQuestion();
  }
});

function showFinal(){
  card.innerHTML = `
    <div class="final">
      <div>خلصت! نتيجتك:</div>
      <div class="score">${score} / ${questions.length}</div>
      <p>${score >= 8 ? 'جامد جدًا يا كابتن!' : score >= 5 ? 'مش وحش، بس فيه مجال للتحسين' : 'محتاج تراجع معلوماتك عن الكورة 😄'}</p>
      <button class="restart" id="restartBtn">جرب تاني</button>
    </div>
  `;
}

renderQuestion();
