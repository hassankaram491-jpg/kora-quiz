<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي المعرفة - كرة القدم والمعلومات العامة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a0f08 0%, #2d1b0e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f5ede3;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: #2b190d;
            border: 2px solid #4a2c15;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .hidden { display: none !important; }
        
        .main-menu {
            text-align: center;
        }
        
        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #ff7a1a;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .subtitle {
            color: #b8977a;
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            border: none;
            border-radius: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: #1a0f08;
        }
        
        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        
        .btn-football {
            background: #2ecc71;
        }
        
        .btn-general {
            background: #3498db;
        }
        
        .level-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            border: 2px solid;
            border-radius: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-align: right;
            background: transparent;
        }
        
        .easy {
            border-color: #2ecc71;
            color: #2ecc71;
        }
        .easy:hover { background: rgba(46,204,113,0.2); }
        
        .medium {
            border-color: #f1c40f;
            color: #f1c40f;
        }
        .medium:hover { background: rgba(241,196,15,0.2); }
        
        .hard {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .hard:hover { background: rgba(231,76,60,0.2); }
        
        .points {
            font-size: 0.9rem;
            opacity: 0.8;
            float: left;
        }
        
        .back-btn {
            background: transparent;
            color: #b8977a;
            border: 1px solid #4a2c15;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Cairo', sans-serif;
        }
        
        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #b8977a;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .quiz-header span {
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }
        
        .timer-bar-container {
            width: 100%;
            height: 8px;
            background: #1a0f08;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #4a2c15;
        }
        
        .timer-bar {
            height: 100%;
            background: #ff7a1a;
            width: 100%;
            transition: width 1s linear;
        }
        
        .timer-bar.warning { background: #e74c3c; }
        
        .question {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            border-right: 4px solid #ff7a1a;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .option {
            background: #1a0f08;
            border: 2px solid #4a2c15;
            color: #f5ede3;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            font-size: 1.1rem;
            transition: all 0.2s;
            font-family: 'Cairo', sans-serif;
        }
        
        .option:hover:not(:disabled) {
            border-color: #ff7a1a;
            transform: translateX(-5px);
        }
        
        .option.correct {
            background: rgba(46,204,113,0.2);
            border-color: #2ecc71;
            color: #2ecc71;
        }
        
        .option.wrong {
            background: rgba(231,76,60,0.2);
            border-color: #e74c3c;
            color: #e74c3c;
        }
        
        .option:disabled { cursor: not-allowed; opacity: 0.7; }
        
        .next-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #ff7a1a;
            color: #1a0f08;
            border: none;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }
        
        .results {
            text-align: center;
            padding: 20px;
        }
        
        .final-score {
            font-size: 4rem;
            color: #ff7a1a;
            font-weight: 800;
            margin: 20px 0;
        }
        
        .result-message {
            font-size: 1.2rem;
            color: #b8977a;
            margin-bottom: 30px;
        }
        
        .restart-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Main Menu -->
    <div id="mainMenu" class="main-menu">
        <div class="logo">🏆</div>
        <h1>تحدي المعرفة</h1>
        <p class="subtitle">510 سؤال في مختلف المجالات<br>اختر القسم المفضل لديك</p>
        
        <button class="menu-btn btn-football" onclick="selectCategory('football')">⚽ قسم كرة القدم</button>
        <button class="menu-btn btn-general" onclick="selectCategory('general')">📚 قسم المعلومات العامة</button>
    </div>

    <!-- Level Selection -->
    <div id="levelMenu" class="main-menu hidden">
        <h1 style="margin-bottom: 30px;">اختر المستوى</h1>
        
        <button class="level-btn easy" onclick="startGame('easy')">
            سهل
            <span class="points">200 نقطة للسؤال</span>
        </button>
        
        <button class="level-btn medium" onclick="startGame('medium')">
            متوسط
            <span class="points">400 نقطة للسؤال</span>
        </button>
        
        <button class="level-btn hard" onclick="startGame('hard')">
            صعب
            <span class="points">600 نقطة للسؤال</span>
        </button>
        
        <button class="back-btn" onclick="goBackToMain()">← رجوع للقائمة الرئيسية</button>
    </div>

    <!-- Quiz Area -->
    <div id="quizArea" class="hidden">
        <div class="quiz-header">
            <span>السؤال <b id="currentQ">1</b> / <b id="totalQ">10</b></span>
            <span>الوقت: <b id="timer" style="color: #ff7a1a;">30</b>ث</span>
            <span>النقاط: <b id="score" style="color: #2ecc71;">0</b></span>
        </div>
        
        <div class="timer-bar-container">
            <div class="timer-bar" id="timerBar"></div>
        </div>
        
        <div class="question" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">التالي →</button>
    </div>

    <!-- Results -->
    <div id="resultsArea" class="results hidden">
        <h1>🏆 انتهى التحدي!</h1>
        <div class="final-score" id="finalScore">0</div>
        <div class="result-message" id="resultMessage"></div>
        <button class="restart-btn" onclick="resetGame()">العب مرة أخرى</button>
    </div>
</div>

<script>

let currentCategory = '';
let currentQuestions = [];
let currentIdx = 0;
let score = 0;
let timerInterval;
let timeLeft = 30;
let currentLevel = '';
let pointsPerQuestion = 0;

function selectCategory(category) {
    currentCategory = category;
    document.getElementById('mainMenu').classList.add('hidden');
    document.getElementById('levelMenu').classList.remove('hidden');
}

function goBackToMain() {
    document.getElementById('levelMenu').classList.add('hidden');
    document.getElementById('mainMenu').classList.remove('hidden');
}

function startGame(level) {
    currentLevel = level;
    
    // اختيار قاعدة البيانات المناسبة
    let questionBank = (currentCategory === 'football') ? footballQuestions : generalQuestions;
    
    // نخلط الأسئلة ونختار 10 منها
    let allQs = [...questionBank[level]];
    for (let i = allQs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allQs[i], allQs[j]] = [allQs[j], allQs[i]];
    }
    currentQuestions = allQs.slice(0, 10);
    
    currentIdx = 0;
    score = 0;
    
    if(level === 'easy') pointsPerQuestion = 200;
    else if(level === 'medium') pointsPerQuestion = 400;
    else pointsPerQuestion = 600;
    
    document.getElementById('levelMenu').classList.add('hidden');
    document.getElementById('quizArea').classList.remove('hidden');
    document.getElementById('totalQ').textContent = currentQuestions.length;
    
    loadQuestion();
}

function loadQuestion() {
    const q = currentQuestions[currentIdx];
    document.getElementById('currentQ').textContent = currentIdx + 1;
    document.getElementById('questionText').textContent = q.q;
    document.getElementById('score').textContent = score;
    document.getElementById('nextBtn').style.display = 'none';
    
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(idx);
        container.appendChild(btn);
    });
    
    startTimer();
}

function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 30;
    updateTimer();
    
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
        if(timeLeft <= 0) {
            clearInterval(timerInterval);
            checkAnswer(-1);
        }
    }, 1000);
}

function updateTimer() {
    document.getElementById('timer').textContent = timeLeft;
    const bar = document.getElementById('timerBar');
    bar.style.width = (timeLeft / 30 * 100) + '%';
    
    if(timeLeft <= 5) bar.classList.add('warning');
    else bar.classList.remove('warning');
}

function checkAnswer(selectedIndex) {
    clearInterval(timerInterval);
    const q = currentQuestions[currentIdx];
    const buttons = document.querySelectorAll('.option');
    
    buttons.forEach(btn => btn.disabled = true);
    
    if(selectedIndex === q.correct) {
        buttons[selectedIndex].classList.add('correct');
        score += pointsPerQuestion;
        document.getElementById('score').textContent = score;
    } else {
        if(selectedIndex !== -1) buttons[selectedIndex].classList.add('wrong');
        buttons[q.correct].classList.add('correct');
    }
    
    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    currentIdx++;
    if(currentIdx < currentQuestions.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quizArea').classList.add('hidden');
    document.getElementById('resultsArea').classList.remove('hidden');
    document.getElementById('finalScore').textContent = score;
    
    let msg = '';
    const maxScore = currentQuestions.length * pointsPerQuestion;
    
    if(score >= maxScore * 0.8) msg = 'ممتاز! أنت خبير حقيقي! 🌟';
    else if(score >= maxScore * 0.5) msg = 'جيد جداً! لديك معلومات قوية 👍';
    else msg = 'حاول مرة أخرى لتحسين نتيجتك 💪';
    
    document.getElementById('resultMessage').textContent = msg;
}

function resetGame() {
    document.getElementById('resultsArea').classList.add('hidden');
    document.getElementById('mainMenu').classList.remove('hidden');
}
